[package]
name = "wispr-local"
version = "0.2.0"
description = "Local, privacy-first voice-to-text dictation tool powered by Whisper.cpp"
authors = ["nsoth"]
license = "MIT"
repository = "https://github.com/nsoth/wispr-local"
edition = "2021"
rust-version = "1.77"

[lib]
name = "wispr_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
winreg = "0.52"
whisper-rs = { version = "0.15", features = ["log_backend"] }
cpal = "0.15"
enigo = "0.2"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
directories = "5"
reqwest = { version = "0.12", features = ["json"] }
rodio = "0.19"
log = "0.4"
env_logger = "0.11"
humantime = "2"
regex = "1"
tauri-winrt-notification = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_SystemInformation",
] }

[features]
default = ["cuda"]
# GPU transcription through whisper.cpp's CUDA backend (needs the NVIDIA
# toolkit at build time). `--no-default-features` builds the CPU-only
# variant that CI compiles and tests.
cuda = ["whisper-rs/cuda"]
custom-protocol = ["tauri/custom-protocol"]
